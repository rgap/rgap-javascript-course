<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>01 - Single Threaded Nature</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; background: #f8fafc; color: #334155; }
    .box { padding: 1.5rem; border: 2px solid #ef4444; border-radius: 8px; margin-bottom: 1rem; background: white; }
    button { padding: 0.5rem 1rem; cursor: pointer; color: white; border: none; border-radius: 4px; font-weight: bold; margin-right: 0.5rem; }
    #btn-heavy { background: #ef4444; }
    #btn-click { background: #10b981; }
    #log { margin-top: 1rem; background: #1e293b; color: #38bdf8; padding: 1rem; font-family: monospace; border-radius: 4px; min-height: 100px; }
    .loader { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(0,0,0,0.1); border-radius: 50%; border-top-color: #3b82f6; animation: spin 1s ease-in-out infinite; opacity: 0;}
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h1>01. The Problem: Blocking the Main Thread</h1>
  
  <div class="box">
    <p><strong>Try this experiment:</strong></p>
    <ol>
      <li>Click the green button rapidly. It responds instantly.</li>
      <li>Now, click the red button (Block Thread) ONCE.</li>
      <li>While the thread is blocked, try clicking the green button or selecting text on this page. Everything is frozen!</li>
    </ol>
    
    <button id="btn-heavy">Block Thread (3 sec)</button>
    <button id="btn-click">Normal Click</button>
    <div id="loader" class="loader"></div>

    <div id="log"></div>
  </div>

  <script>
    /*
      ========================================
      THEORY: 1. Single Threaded Nature
      ========================================
      JS can only do one thing at a time. If we block the Call Stack 
      with a heavy synchronous operation, the UI freezes.
    */
    const logDiv = document.getElementById('log');
    const loader = document.getElementById('loader');

    function log(msg, color) {
      logDiv.innerHTML += `<div style="color: ${color}">> ${msg}</div>`;
      console.log(msg);
    }

    document.getElementById('btn-click').addEventListener('click', () => {
      log('🟢 Normal click registered!', '#10b981');
    });

    document.getElementById('btn-heavy').addEventListener('click', () => {
      log('🔴 Starting heavy synchronous task. UI is BLOCKED!', '#ef4444');
      loader.style.opacity = 1;
      
      // Simulate a forced block of the main thread by sleeping for 3 seconds
      const start = Date.now();
      while (Date.now() - start < 3000) {
        // Blocking the V8 Engine...
        // Nothing else can happen on the page until this loop finishes.
      }
      
      log('🔴 Heavy task finished. Thread is free again.', '#ef4444');
      loader.style.opacity = 0;
    });
  </script>
</body>
</html>
