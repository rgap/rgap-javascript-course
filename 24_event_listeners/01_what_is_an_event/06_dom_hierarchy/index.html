<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>06 - DOM Hierarchy</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; background: #f8fafc; color: #334155; }
  </style>
</head>
<body>
  <h1>Basic DOM Hierarchy</h1>
  <p>Open the console to inspect the prototype chain of an element.</p>
  <button id="testBtn">Test Button</button>

  <script>
    /*
      ========================================
      THEORY: 6. DOM Hierarchy
      ========================================
      Let's traverse the prototype chain to prove that HTMLButtonElement
      eventually inherits from EventTarget.
    */
    const btn = document.getElementById('testBtn');
    
    let currentProto = Object.getPrototypeOf(btn);
    
    console.log("--- Prototype Chain for a Button ---");
    while (currentProto && currentProto.constructor.name !== "Object") {
      console.log(currentProto.constructor.name);
      currentProto = Object.getPrototypeOf(currentProto);
    }
  </script>
</body>
</html>
