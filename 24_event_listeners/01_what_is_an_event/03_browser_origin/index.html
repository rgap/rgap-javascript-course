<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>03 - Browser Origin</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; background: #f8fafc; color: #334155; }
    .box { padding: 1rem; border: 2px solid #cbd5e1; }
  </style>
</head>
<body>
  <h1>Events caused by the browser</h1>
  <p>Resize your browser window to see the event in action.</p>
  <div id="status" class="box">Window size: </div>

  <script>
    /*
      ========================================
      THEORY: 3. Events caused by the browser
      ========================================
      The browser itself emits events when its state changes.
      A classic example is the "resize" event on the window object.
    */
    const statusBox = document.getElementById('status');

    function updateSize() {
      statusBox.textContent = `Window size: ${window.innerWidth}px x ${window.innerHeight}px`;
      console.log('Browser window resized!');
    }

    // Initial call
    updateSize();

    // Listen for the browser event
    window.addEventListener('resize', updateSize);
  </script>
</body>
</html>
