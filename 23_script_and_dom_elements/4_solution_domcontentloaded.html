<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Solution: DOMContentLoaded via defer</title>
    <!-- 
      THEORY: THE EVENT-DRIVEN SOLUTION (MODERN)
      DOMContentLoaded is the superior alternative to window.onload.
      
      It fires the exact millisecond the browser finishes building the DOM Tree 
      from the HTML. It does NOT wait for CSS, Images, or Iframes to download.

      This means your JavaScript runs much faster and your app becomes 
      interactive immediately!
    -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        console.log("HTML is parsed and DOM is ready! Ignoring slow images.");
        document.getElementById("id").innerHTML = "Hello World (DOMContentLoaded)";
      });
    </script>
  </head>
  <body>
    <h1 id="id">[id]</h1>
  </body>
</html>
