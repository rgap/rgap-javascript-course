<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Append and Remove Elements</title>
</head>
<body>
  <div id="box">
    <p id="middle">Middle Paragraph</p>
  </div>
  <button id="removeBtn">Remove First Element</button>
  <script>
    const box = document.getElementById('box');
    
    // prepend() adds an element to the BEGINNING
    const firstP = document.createElement('p');
    firstP.textContent = "First Paragraph";
    box.prepend(firstP);
    
    // append() adds an element to the END
    const lastP = document.createElement('p');
    lastP.textContent = "Last Paragraph";
    box.append(lastP);

    // remove() removes an element from the DOM
    document.getElementById('removeBtn').addEventListener('click', () => {
      if (box.firstElementChild) {
        box.firstElementChild.remove();
      }
    });
  </script>
</body>
</html>
